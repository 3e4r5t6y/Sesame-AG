name: Build Dev APKs
run-name: Build Dev APKs - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          # Gradle derives versionCode from the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: "17.0.1"
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signatures
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying ${apk}"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify "${apk}"
          done

      - name: Upload APKs to this run
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-dev-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
